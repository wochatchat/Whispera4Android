# Gradle properties
# Heap: 4 GB. GitHub Actions ubuntu-24.04 runners have ~7 GB usable RAM.
# 2 GB was OOM-killing compressOfflineFullReleaseAssets (CompressAssetsWorkAction
# reads bundled ONNX models — silero_vad + SenseVoice int8 (~163 MB) + Kokoro
# v1.1 (~350 MB), ~500 MB+ of binaries — into the JVM heap to deflate them).
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
