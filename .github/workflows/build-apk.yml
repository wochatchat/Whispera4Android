name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'scripts/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'gradle/wrapper/**'
      - '.github/workflows/build-apk.yml'
    # Allow manual trigger from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          sdk-platform: 34
          sdk-build-tools: 34.0.0
          ndk-version: '26.1.10909125'

      - name: Cache Gradle and sherpa-onnx AAR
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            app/libs
            app/src/main/assets/models
          key: whispera4android-gradle-${{ hashFiles('**/*.gradle.kts') }}-sherpa-1.13.4-models-v1
          restore-keys: whispera4android-gradle-

      - name: Download models & sherpa-onnx AAR
        # Full model set (~500 MB: silero VAD 2 MB + SenseVoice int8 163 MB +
        # Kokoro v1.1 350 MB) goes to app/src/main/assets/models so the
        # offlineFull APK is self-contained. The liteCloud build below strips
        # this directory first (see its step comments) so it ships lean and
        # downloads models at runtime.
        shell: bash
        run: ./scripts/setup_models.sh --assets

      - name: Verify builtin keystore is committed
        shell: bash
        run: |
          if [[ ! -f app/keystore/builtin-release.p12 ]]; then
            echo "✗ builtin-release.p12 missing — generate it with ./scripts/gen-builtin-keystore.sh"
            exit 1
          fi
          echo "✓ Built-in test keystore present: app/keystore/builtin-release.p12"

      - name: Make gradlew executable
        shell: bash
        run: chmod +x ./gradlew || true

      - name: Build signed release APK (offlineFull flavor)
        # Models are in app/src/main/assets/models/ — this bundle is ~637 MB.
        shell: bash
        run: ./gradlew assembleOfflineFullRelease --console=plain --stacktrace

      - name: Locate built APK
        id: locate_apk
        shell: bash
        run: |
          set -x
          APK=$(find app/build/outputs/apk -name 'app-offlineFull-release*.apk' -print -quit)
          if [[ -z "$APK" ]]; then
            echo "✗ No offlineFull APK produced"
            exit 1
          fi
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Whispera4Android-offlineFull-release
          path: ${{ steps.locate_apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

      # Let liteCloud ship without bundled models (so the APK stays ~5 MB).
      # Runtime downloads land under ctx.filesDir/models/ via app code; this
      # step removes the heavy assets the offlineFull build stuffed above so
      # the liteCloud flavor does not pick them up too. (Before this `rm`,
      # BOTH flavors acquired the ~500 MB of ONNX — see global memory note —
      # making the two APKs identical in size and useless for users wanting
      # the lean download-on-demand build.)
      - name: Strip bundled models for liteCloud build
        shell: bash
        run: |
          rm -rf app/src/main/assets/models
          mkdir -p app/src/main/assets/models
          touch app/src/main/assets/models/.gitkeep
          echo "Models removed for liteCloud; assets/models now contains:"
          ls -la app/src/main/assets/models

      - name: Build signed release APK (liteCloud flavor)
        # Lean build — no bundled ONNX. Users download models at runtime.
        shell: bash
        run: ./gradlew assembleLiteCloudRelease --console=plain --stacktrace

      - name: Locate liteCloud APK
        id: locate_lite_apk
        shell: bash
        run: |
          set -x
          APK=$(find app/build/outputs/apk -name 'app-liteCloud-release*.apk' -print -quit)
          if [[ -z "$APK" ]]; then
            echo "✗ No liteCloud APK produced"
            exit 1
          fi
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: Upload liteCloud APK
        uses: actions/upload-artifact@v4
        with:
          name: Whispera4Android-liteCloud-release
          path: ${{ steps.locate_lite_apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30
